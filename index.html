    <!-- ═══════════════════════════════════════════
         PERSON STRUCTURED DATA (JSON-LD)
         Helps Google understand this is a person's
         professional portfolio — improves search
         appearance and knowledge panel eligibility
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Daniel Adeleye",
        "url": "https://dan-lac.vercel.app/",
        "jobTitle": "Frontend Developer & Product Builder",
        "description": "Frontend-focused developer and product builder creating premium digital experiences. Founder of Tirenify.",
        "sameAs": ["https://x.com/tirenify", "https://tirenify.app"],
        "knowsAbout": [
          "Frontend Development",
          "React",
          "Product Design",
          "Digital Security",
          "African Tech"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Akure",
          "addressCountry": "NG"
        }
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Font Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Space Grotesk (Display), Syne fallback, Inter (Body), JetBrains Mono (Mono fallback for Geist Mono) -->

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"

    />

    />
