<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#03060f" rx="48"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#65c7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d8bff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5f8cff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6bd7ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Subtle glow -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#glowGradient)" stroke-width="1" opacity="0.6"/>
  
  <!-- "D" letterform -->
  <text x="52" y="180" font-family="'Inter', system-ui, sans-serif" font-size="120" font-weight="800" fill="url(#faviconGradient)" letter-spacing="-4">
    DA
  </text>
</svg>
